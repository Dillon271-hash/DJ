<!--
  Encore-branded "Confirm signup" email for Supabase Auth.

  This isn't picked up automatically — Supabase doesn't read template
  files from your repo. To use it: Supabase Dashboard → Authentication →
  Emails → "Confirm signup" tab → paste this into the body field → Save.
  {{ .ConfirmationURL }} is a Supabase template variable it fills in with
  the real confirmation link; leave it exactly as-is.
-->
<div style="background-color:#08070a; padding:40px 20px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px; margin:0 auto;">
    <tr>
      <td align="center" style="padding-bottom:28px;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="width:40px; height:40px; border-radius:50%; background-image:radial-gradient(circle at 50% 50%, #08070a 0 18%, transparent 19%), radial-gradient(circle at 50% 50%, #ff3d22 0 55%, #ffb13b 100%); box-shadow:inset 0 0 0 1px rgba(239,234,223,0.14); font-size:0; line-height:0;">&nbsp;</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:4px;">
        <span style="font-family:Arial Black, Arial, sans-serif; font-weight:900; font-size:22px; letter-spacing:-0.02em; color:#efeadf;">ENCORE</span>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:28px;">
        <span style="font-family:'SF Mono', Menlo, Consolas, monospace; text-transform:uppercase; letter-spacing:0.16em; font-size:11px; color:#8b8779;">Confirm your email</span>
      </td>
    </tr>
    <tr>
      <td style="background-color:#100e13; border:1px solid rgba(239,234,223,0.14); border-radius:16px; padding:32px 28px;">
        <p style="margin:0 0 20px; color:#efeadf; font-size:15px; line-height:1.6;">
          One click and your ranked diary of DJ sets is ready to go.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px;">
          <tr>
            <td style="border-radius:999px;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block; padding:14px 28px; font-family:Arial Black, Arial, sans-serif; font-weight:900; text-transform:uppercase; font-size:13px; letter-spacing:-0.01em; color:#08070a; text-decoration:none; background-color:#ffd400; border:2px solid #08070a; border-radius:999px; box-shadow:4px 4px 0 #ff1f7a;">
                Confirm email
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:0; color:#8b8779; font-size:13px; line-height:1.6;">
          Didn't sign up for Encore? You can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:24px;">
        <span style="font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; color:#55503f;">
          If the button doesn't work, paste this into your browser:<br />
          <a href="{{ .ConfirmationURL }}" style="color:#8b8779;">{{ .ConfirmationURL }}</a>
        </span>
      </td>
    </tr>
  </table>
</div>
